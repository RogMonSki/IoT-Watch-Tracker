<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Step Leaderboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.22.2/firebase-app-compat.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.22.2/firebase-database-compat.min.js"></script>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }
        table, th, td {
            border: 1px solid black;
        }
        th, td {
            padding: 8px;
            text-align: left;
        }
    </style>
</head>
<body>
    <h1>Step Leaderboard</h1>
    
    <div id="error-message" style="color: red;"></div>
    <div id="connection-status"></div>
    
    <p>Last updated: <span id="last-updated">Never</span></p>
    
    <table>
        <thead>
            <tr>
                <th>Rank</th>
                <th>Username</th>
                <th>Step Count</th>
                <th>Last Updated</th>
            </tr>
        </thead>
        <tbody id="leaderboard-body">
            <tr>
                <td colspan="4">Loading data...</td>
            </tr>
        </tbody>
    </table>
    
    <script>
        //firebase configuration
        const firebaseConfig = {
            databaseURL: "https://com3505-3ba3c-default-rtdb.europe-west1.firebasedatabase.app",
        };
        
        let app;
        let database;
        
        document.addEventListener('DOMContentLoaded', function() {
            try {
                app = firebase.initializeApp(firebaseConfig);
                database = firebase.database();
                
                //connection status
                const connectedRef = database.ref(".info/connected");
                connectedRef.on("value", (snap) => {
                    if (snap.val() === true) {
                        document.getElementById("connection-status").textContent = "Connected to Firebase";
                    } else {
                        document.getElementById("connection-status").textContent = "Disconnected from Firebase";
                    }
                });
                
                loadLeaderboard();
                
                //refresh every minute
                setInterval(loadLeaderboard, 60000);
            } catch (error) {
                console.error("Firebase initialization error:", error);
                document.getElementById("error-message").textContent = "Error connecting to Firebase: " + error.message;
            }
        });
        
        function loadLeaderboard() {
            const stepsRef = database.ref('steps');
            stepsRef.once('value', (snapshot) => {
                if (snapshot.exists()) {
                    updateLeaderboard(snapshot.val());
                } else {
                    document.getElementById("leaderboard-body").innerHTML = 
                        '<tr><td colspan="4">No devices found</td></tr>';
                }
                
                document.getElementById("last-updated").textContent = new Date().toLocaleString();
            }).catch(error => {
                console.error("Error loading leaderboard data:", error);
                document.getElementById("error-message").textContent = "Error loading leaderboard data: " + error.message;
            });
        }
        
        function updateLeaderboard(data) {
            const devices = [];
            for (const deviceId in data) {
                devices.push({
                    id: deviceId,
                    steps: data[deviceId].steps || 0,
                    datetime: data[deviceId].datetime || 'Unknown'
                });
            }
            
            devices.sort((a, b) => b.steps - a.steps);
            
            const tableBody = document.getElementById("leaderboard-body");
            tableBody.innerHTML = '';

            devices.forEach((device, index) => {
                const row = document.createElement('tr');

                const rankCell = document.createElement('td');
                rankCell.textContent = index + 1;
                row.appendChild(rankCell);
                
                const deviceCell = document.createElement('td');
                deviceCell.textContent = device.id;
                row.appendChild(deviceCell);
                
                const stepsCell = document.createElement('td');
                stepsCell.textContent = device.steps.toLocaleString();
                row.appendChild(stepsCell);
                
                const dateCell = document.createElement('td');
                try {
                    const date = new Date(device.datetime);
                    dateCell.textContent = date.toLocaleString();
                } catch (e) {
                    dateCell.textContent = device.datetime;
                }
                row.appendChild(dateCell);
                
                tableBody.appendChild(row);
            });
            
            if (devices.length === 0) {
                const row = document.createElement('tr');
                const cell = document.createElement('td');
                cell.colSpan = 4;
                cell.textContent = 'No data available';
                row.appendChild(cell);
                tableBody.appendChild(row);
            }
        }
    </script>
</body>
</html>
